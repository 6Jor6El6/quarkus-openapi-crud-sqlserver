quarkus:
  http:
    port: 8080

  # =========================
  # OpenAPI / Swagger
  # =========================
  swagger-ui:
    always-include: true

  smallrye-openapi:
    path: /openapi

  # =========================
  # Datasource H2
  # =========================
  datasource:
    db-kind: h2
    username: sa
    password: sa
    jdbc:
      url: jdbc:h2:mem:customersdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
#      url: >
#        jdbc:h2:file:./data/demo;
#        MODE=MSSQLServer;
#        DATABASE_TO_UPPER=false;
#        DB_CLOSE_DELAY=-1

# =========================
# Logging
# =========================
#  log:
#    level: INFO
#    console:
#      enable: true
#      level: INFO
  log:
    category:
      "org.hibernate.SQL":
        level: DEBUG
      "org.hibernate.orm.jdbc.bind":
        level: TRACE



  # =========================
  # Hibernate ORM (imperativo)
  # =========================
  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: true

  # =========================
  # Flyway
  # =========================
#  flyway:
#    migrate-at-start: true
#    locations: db/migration

  # =========================
  # H2 Console
  # =========================
  h2:
    console:
      enabled: true
      path: /h2